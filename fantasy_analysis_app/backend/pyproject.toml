[project]
name = "fantasy-analysis-backend"
version = "0.1.0"
description = "Private ESPN fantasy football league analytics API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "SIM"]
ignore = [
    "DJ001",  # allow null=True on string fields where ESPN data is genuinely absent
    "DJ012",  # method-ordering aesthetics; we group @property helpers with fields
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["league/tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['migrations/', '\.venv/']
ignore_missing_imports = true
check_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings"
