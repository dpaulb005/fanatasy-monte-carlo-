name: test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt pytest
      - name: Unit and invariant tests
        run: python -m pytest -q -W error
      - name: Compile modules
        run: python -m compileall -q nflsim tests

  app-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy_analysis_app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fantasy_analysis_app/backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint and type check
        run: |
          ruff check league config
          mypy league config
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest -q

  app-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fantasy_analysis_app/frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fantasy_analysis_app/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint, test, and build
        run: |
          npm run lint
          npm test -- --run
          npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked application files
        working-directory: fantasy_analysis_app
        run: ./scripts/check_secrets.sh

